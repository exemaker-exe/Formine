<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1fb0ff"/>
      <stop offset="50%" stop-color="#07b0ff"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Stylized blocky letters, each slightly transformed to mimic the reference -->
  <g fill="#ffffff" font-family="Impact, 'Arial Black', sans-serif" font-weight="700" filter="url(#soft)">
    <text x="40"  y="200" font-size="220" transform="skewX(-4) rotate(-1 120 180)">F</text>
    <text x="170" y="198" font-size="220" transform="skewX(1) rotate(0 260 180)">O</text>
    <text x="330" y="200" font-size="220" transform="skewX(-3) rotate(-2 410 180)">R</text>
    <text x="490" y="192" font-size="220" transform="skewX(2) rotate(1 570 180)">M</text>
    <text x="690" y="196" font-size="220" transform="skewX(-2) rotate(-1 770 180)">I</text>
    <text x="760" y="202" font-size="220" transform="skewX(3) rotate(2 820 180)">N</text>
    <text x="930" y="198" font-size="220" transform="skewX(-1) rotate(0 1010 180)">E</text>
  </g>

  <!-- Thin outer stroke to give a cut-paper look (white letters already, so use subtle inner shadow) -->
  <g fill="none" stroke="#e6f6ff" stroke-width="6" opacity="0.12">
    <text x="40"  y="200" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(-4) rotate(-1 120 180)">F</text>
    <text x="170" y="198" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(1) rotate(0 260 180)">O</text>
    <text x="330" y="200" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(-3) rotate(-2 410 180)">R</text>
    <text x="490" y="192" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(2) rotate(1 570 180)">M</text>
    <text x="690" y="196" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(-2) rotate(-1 770 180)">I</text>
    <text x="760" y="202" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(3) rotate(2 820 180)">N</text>
    <text x="930" y="198" font-size="220" font-family="Impact, 'Arial Black', sans-serif" transform="skewX(-1) rotate(0 1010 180)">E</text>
  </g>

</svg>
